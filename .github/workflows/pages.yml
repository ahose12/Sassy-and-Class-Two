name: Build catalog and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build_catalog.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html fire-sales.html styles.css app.js config.js _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
